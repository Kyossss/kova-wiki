# Builds the wiki with MkDocs Material and deploys it to GitHub Pages.
# The sources are copied in from KovaPlugins by its tools/publish-wiki.sh; edit them there.
name: Build wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -r docs-requirements.txt
          mkdocs build --strict -d site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
